<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOW Missions Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f5f1;--surface:#fff;--sunk:#eeede6;--ink:#26251f;--muted:#69665a;--line:#e1ded2;
  --ol:#b5985a;--ol-ink:#7a6230;--ol-soft:#f5eedf;
  --green:#2f7a55;--green-soft:#e2f0e8;--red:#b0432f;--red-soft:#f8e4df;--blue:#2d5f8a;--blue-soft:#e2ecf5;--amber:#9a6a00;--amber-soft:#fbefd2;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1a16;--surface:#23231e;--sunk:#2c2b25;--ink:#ecebe2;--muted:#a6a392;--line:#3a3931;
  --ol:#c9ad6e;--ol-ink:#dcc48e;--ol-soft:#3a3123;
  --green:#6cc196;--green-soft:#1f3229;--red:#e98a75;--red-soft:#3d2520;--blue:#8db7de;--blue-soft:#1f2c39;--amber:#e6b85a;--amber-soft:#3a2f17;}}
:root[data-theme="dark"]{
  --bg:#1a1a16;--surface:#23231e;--sunk:#2c2b25;--ink:#ecebe2;--muted:#a6a392;--line:#3a3931;
  --ol:#c9ad6e;--ol-ink:#dcc48e;--ol-soft:#3a3123;
  --green:#6cc196;--green-soft:#1f3229;--red:#e98a75;--red-soft:#3d2520;--blue:#8db7de;--blue-soft:#1f2c39;--amber:#e6b85a;--amber-soft:#3a2f17;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ol-ink)}
:focus-visible{outline:2px solid var(--ol);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.2}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hide{display:none!important}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;font-size:16px}
.brand img{height:34px;width:auto}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-left:auto}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.who{font-size:13px;color:var(--muted);white-space:nowrap}
.who button{background:none;border:0;color:var(--ol-ink);font-weight:700;padding:0 0 0 6px}
.who .sync{color:var(--muted);font-weight:600;padding:0 8px 0 0}.who .sync.ok{color:var(--green)}.who .sync.err{color:var(--red);text-decoration:underline}

main{padding:26px 0 70px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;justify-content:space-between;margin-bottom:20px}
.pagehead h1{font-size:28px;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--muted);margin:4px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--ol);border-color:var(--ol);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--ol-ink);font-weight:700;text-align:left}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:22px}
.stat{padding:16px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.panel h2{font-size:16px;font-weight:700;margin-bottom:12px}
.panel+.panel,.stack>*+*{margin-top:20px}
.muted{color:var(--muted)}
.small{font-size:13px}

.triprow{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:14px 0;border:0;border-top:1px solid var(--line);text-align:left;background:none;width:100%}
.triprow:first-of-type{border-top:0}
.triprow:hover .tname{color:var(--ol-ink)}
.tname{font-weight:700;font-size:16px}
.tmeta{color:var(--muted);font-size:13px}
.segs{display:flex;gap:3px;grid-column:1/-1}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.segs i.d{background:var(--ol)}
.segs i.c{background:linear-gradient(90deg,var(--ol) 50%,var(--line) 50%)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.b-ol{background:var(--ol-soft);color:var(--ol-ink)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-grey{background:var(--sunk);color:var(--muted)}

.att{border-top:1px solid var(--line);padding:12px 0}
.att:first-child{border-top:0;padding-top:0}
.att h3{font-size:14px;font-weight:800;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.att ul{list-style:none;margin:0;padding:0}
.att li{display:flex;gap:9px;align-items:flex-start;padding:3px 0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--red)}
.dot.w{background:var(--ol)}
.att button.link{font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.att button.link:hover{text-decoration-color:var(--ol)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:Manrope,sans-serif}
.chart .val{fill:var(--ink);font-weight:700}
.bars rect.live{fill:var(--ol)}
.bars rect.arch{fill:var(--line)}
.bars rect.plan{fill:none;stroke:var(--ol);stroke-dasharray:3 3}

.back{background:none;border:0;color:var(--muted);font-weight:600;padding:0;margin-bottom:12px}
.thead{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.thead h1{font-size:34px;font-weight:800;letter-spacing:-.025em}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px}
.facts div span{display:block;color:var(--muted);font-size:12px}
.facts div b{font-weight:700}

.journey{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 10px 16px;overflow-x:auto;margin-bottom:20px}
.track{position:relative;display:grid;grid-template-columns:repeat(9,minmax(80px,1fr));min-width:720px}
.track::before{content:"";position:absolute;left:5.5%;right:5.5%;top:17px;height:2px;background:var(--line)}
.track .fill{position:absolute;left:5.5%;top:17px;height:2px;background:var(--ol);transition:width .5s ease}
.st{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 4px;text-align:center}
.st .c{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);border:2px solid var(--line);color:var(--muted);transition:transform .15s}
.st.done .c{background:var(--ol);border-color:var(--ol);color:#fff}
.st.cur .c{border-color:var(--ol);color:var(--ol-ink);box-shadow:0 0 0 5px var(--ol-soft)}
.st.late .c{border-color:var(--red);color:var(--red)}
.st .l{font-size:12px;font-weight:700;line-height:1.25}
.st .p{font-size:11px;color:var(--muted)}
.st[aria-pressed="true"] .c{transform:scale(1.12)}
.st[aria-pressed="true"] .l{color:var(--ol-ink)}

.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ol)}

.check{list-style:none;padding:0;margin:0}
.check li{border-top:1px solid var(--line);padding:11px 0}
.check li:first-child{border-top:0}
.ci{display:flex;align-items:flex-start;gap:12px}
.ci label{flex:1;display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-width:0}
.check input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--ol);flex:none}
.check input[type=checkbox]:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ink)}
.addr{background:none;border:0;padding:2px 0;font-size:12px;color:var(--muted);white-space:nowrap;opacity:.75}
.addr:hover{opacity:1;color:var(--ol-ink)}
.rmk{display:block;margin:3px 0 0 30px;font-size:13px;color:var(--muted);background:none;border:0;padding:0;text-align:left}
.rmk:hover{color:var(--ink)}
.rmk-in{display:block;margin:6px 0 0 30px;width:calc(100% - 30px);border:0;border-bottom:1px solid var(--ol);background:transparent;padding:4px 2px;font-size:14px}
.rmk-in:focus{outline:none}
.pinp{border:0;border-bottom:1px solid var(--line);background:transparent;padding:2px 4px;width:190px;font-size:14px;text-align:right}
.pinp:focus{outline:none;border-bottom-color:var(--ol)}
.pinp::placeholder{color:var(--muted)}
.sugg{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:1px 7px;border-radius:999px;margin-left:6px;display:inline-block}
.stephead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:12px}
.stephead h2{margin:0}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.policy th{background:var(--ol);color:#fff;font-size:13px}
table.policy td{border:1px solid var(--line)}
tr.total td{font-weight:800;border-top:2px solid var(--line)}

.money{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin-bottom:20px}
.money div{padding:14px 16px;border-left:1px solid var(--line)}
.money div:first-child{border-left:0}
.money span{display:block;font-size:12px;color:var(--muted)}
.money b{font-size:20px;font-weight:800}
.catbar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.catbar .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.catbar .bar i{display:block;height:100%;background:var(--ol)}

.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px}
.form .full{grid-column:1/-1}
.form label,.fl{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.form label small{font-weight:500;color:var(--muted)}
.form textarea,.form input,.form select,.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.form textarea{min-height:84px;resize:vertical}
.aibar{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.note{border-left:3px solid var(--ol);padding:4px 0 4px 14px;color:var(--muted);font-size:14px;margin:0 0 16px}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.warn.r{background:var(--red-soft);color:var(--red)}
.empty{padding:24px 0;text-align:center;color:var(--muted)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:220px}

.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.team{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.team h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.team label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:8px 0 4px}
.team ul{margin:8px 0 0;padding-left:18px;font-size:14px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,20,10,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(620px,100%);height:100%;overflow-y:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px));box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.sheet.center{margin:auto;height:auto;max-height:92%;border-radius:16px;width:min(560px,94%)}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheethead h2{font-size:22px;font-weight:800}
.x{background:var(--sunk);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;flex:none}
.sec{margin-top:18px}
.sec h3{font-size:13px;color:var(--ol-ink);font-weight:800;margin-bottom:6px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.mask{font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;width:min(420px,100%)}
.login img{width:100%;max-width:300px;display:block;margin:0 auto 18px;background:#fff;border-radius:10px;padding:10px}
.login h1{font-size:22px;text-align:center;margin-bottom:18px}
.login label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
.login .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.demo{margin-top:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

#print{display:none}
.flow{padding:12px 16px}.flow summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.flow summary::-webkit-details-marker{display:none}
.flow summary>span{flex:1}.flow summary::after{content:'Show';font-size:12px;font-weight:600;color:var(--ol-ink)}.flow[open] summary::after{content:'Hide'}
.flowwrap{overflow-x:auto;margin-top:10px}.flowsvg{display:block;width:100%;min-width:560px;max-width:780px;height:auto;margin:0 auto}
.flowsvg g.cur rect{stroke:#26251F;stroke-width:2.5}.flowsvg g.dn{opacity:.55}
.attnote{font-size:12px;color:var(--muted);margin:-6px 0 10px}
th.balc,td.balc{border-left:2px solid var(--ol);background:var(--ol-soft);padding-left:12px}
th.balc{color:var(--ol-ink);font-weight:800}
.tchips{display:flex;flex-wrap:wrap;gap:4px}
.tchip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tchip.now{background:var(--ol-soft);color:var(--ol-ink)}
.att li{font-size:13px}.att button.link{font-weight:400!important;font-size:13px}
.att h3{font-size:13.5px}
.bind{margin:10px 0 2px 30px;padding:2px 0 2px 14px;border-left:2px solid var(--ol-soft)}
.bind .form{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px}
.bind label{font-size:12px;color:var(--muted)}
.bind table td{padding:4px 6px;border-bottom:0}.bind table th{padding:4px 6px}
.bind input.inp,.bind select.inp{padding:6px 9px;font-size:14px}
.formsbar{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-bottom:14px;font-size:13px}
.formsbar .link{font-weight:600;font-size:13px}
.duein{border:0;background:transparent;color:var(--muted);font-size:13px;padding:2px}
.wfnote{font-size:13px;color:var(--muted);margin:0 0 12px}
.formsbar span{font-size:12px;color:var(--muted);font-weight:700;margin-right:2px}
.summ{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
.sbox{display:flex;align-items:center;justify-content:space-between;gap:8px;height:64px;padding:0 16px;border-radius:12px;border:1px solid var(--line);border-left-width:5px;background:var(--surface);text-align:left;width:100%}
.sbox span{font-size:13px;font-weight:700;line-height:1.2}
.sbox b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.sbox.upcoming{border-left-color:var(--ol)}.sbox.upcoming b{color:var(--ol-ink)}
.sbox.pending{border-left-color:var(--amber)}.sbox.pending b{color:var(--amber)}
.sbox.closed{border-left-color:var(--green)}.sbox.closed b{color:var(--green)}
.sbox.cancelled{border-left-color:var(--red)}.sbox.cancelled b{color:var(--red)}
.sbox[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink) inset}
.next{font-size:12.5px;color:var(--ol-ink);margin-top:2px}
table.sm{font-size:12.5px}table.sm td{padding:6px 8px}table.sm th{padding:6px 8px}
tr.cancel td{color:var(--muted)}
@media (max-width:820px){.summ{grid-template-columns:1fr 1fr}.bind{margin-left:0}}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000;font-size:11pt}
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print h1{font-size:20pt;margin:6pt 0}
  #print h2{font-size:13pt;margin:16pt 0 6pt;color:#7a6230;border-bottom:1px solid #b5985a;padding-bottom:3pt}
  #print table{font-size:9.5pt;page-break-inside:auto}
  #print tr{page-break-inside:avoid}
  #print th{color:#333;border-bottom:1px solid #999}
  #print td{border-bottom:1px solid #ddd;padding:4pt 6pt}
  #print .phead{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #b5985a;padding-bottom:6pt}
  #print .phead img{height:44pt}
  #print .pg{page-break-before:always}
  #print p{margin:3pt 0 8pt;white-space:pre-wrap}
  #print .lbl{font-weight:700;margin-top:8pt}
  #print,#print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wfp{font-family:Helvetica,Arial,sans-serif;color:#26251f;font-size:8.5pt}
  .wfp .lg{height:44pt;display:block;margin-bottom:6pt}
  .wfp .tt{text-align:center;font-weight:700;font-size:17pt;margin:2pt 0}
  .wfp .st{text-align:center;font-style:italic;color:#6c665b;font-size:8.5pt;margin-bottom:10pt}
  .wfp table{width:100%;border-collapse:collapse;page-break-inside:auto}
  .wfp tr{page-break-inside:avoid}
  .wfp .tb td{border:.6pt solid #cfc9b8;padding:3pt 6pt;height:20pt;vertical-align:top;width:50%}
  .wfp .tb td[colspan]{width:100%}
  .wfp .tb{margin-bottom:4pt}
  .wfp .tb span{display:block;color:#6c665b;font-size:7.5pt}
  .wfp .sh{color:#b5985a;font-weight:700;font-size:10pt;margin:12pt 0 5pt;page-break-after:avoid}
  .wfp .sh span{color:#6c665b;font-weight:400;font-size:8pt}
  .wfp .ck th{background:#b5985a!important;color:#fff;text-align:left;font-size:8.5pt;padding:4pt 6pt;border:.6pt solid #cfc9b8}
  .wfp .ck td{border:.6pt solid #cfc9b8;padding:4pt 6pt;vertical-align:middle;height:14pt}
  .wfp .ck .c{width:14pt;text-align:center;font-size:11pt;padding:2pt;font-family:'Segoe UI Symbol','DejaVu Sans','Arial Unicode MS',Arial,sans-serif}
  .wfp .ck .i{width:48%}.wfp .ck .w{width:30%}
  .wfp .ck tr.bd td{background:#f6f1e6!important;color:#6c665b;font-size:8pt}
  .wfp table.in{margin:2pt 0;background:#fff}.wfp table.in th{background:none!important;color:#6c665b;font-weight:400;font-size:7.5pt;border:.4pt solid #cfc9b8;padding:2pt 4pt}
  .wfp table.in td{background:#fff!important;border:.4pt solid #cfc9b8;padding:2pt 4pt;height:12pt;color:#26251f}

  .wfp .tb td{width:auto}

}
@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
  .stats,.money{grid-template-columns:1fr 1fr}
  .stat:nth-child(3),.money div:nth-child(3){border-left:0}
  .stat:nth-child(n+3),.money div:nth-child(n+3){border-top:1px solid var(--line)}
  .top .wrap{flex-wrap:wrap;padding-top:8px;padding-bottom:6px;gap:6px}
  nav.tabs{margin-left:0;width:100%;order:3}
  .who{margin-left:auto}
  .thead h1{font-size:28px}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .catbar{grid-template-columns:110px 1fr 80px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.acclist{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin-top:6px}
.accrow{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-weight:400;cursor:pointer}.accrow:last-child{border-bottom:0}.accrow input{width:16px;height:16px;flex:none}

/* =================== helpers =================== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{if(!s)return '—';const d=new Date(s);if(isNaN(d))return esc(s);return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const fr=(a,b)=>{const x=new Date(a),y=new Date(b);return x.getMonth()===y.getMonth()&&x.getFullYear()===y.getFullYear()?`${x.getDate()}–${y.getDate()} ${MON[y.getMonth()]} ${y.getFullYear()}`:`${fd(a)} – ${fd(b)}`};
const rm=n=>'RM'+(Math.round((+n||0)*100)/100).toLocaleString('en-MY',{maximumFractionDigits:2});
const shift=(d,days)=>{const x=new Date(d);x.setDate(x.getDate()+days);return x.toISOString().slice(0,10)};
const ymd=d=>String(d).replace(/-/g,'').slice(0,8);
const fdt=s=>{const d=new Date(s);return `${fd(s)}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function sha(text){
  const data=new TextEncoder().encode(text);
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=7;for(const c of data)h=(h*31+c)|0;return 'x'+h;
}
const maskIC=v=>{v=String(v||'');if(!v)return '—';const tail=v.replace(/\D/g,'').slice(-4);return '******-**-'+tail};
const maskPP=v=>{v=String(v||'');if(!v)return '—';return v.slice(0,1)+'•'.repeat(Math.max(3,v.length-3))+v.slice(-2)};

}

let SNAP=null,Q=[],flushT=null,flushing=false;
function ents(db){const m={},put=(c,k,o)=>m[c+'|'+k]=JSON.stringify(o);
  db.trips.forEach(t=>put('trips',t.id,t));db.regs.forEach(r=>put('regs',r.id,r));db.ledger.forEach(l=>put('ledger',l.id,l));db.withdrawals.forEach(w=>put('withdrawals',w.id,w));db.archive.forEach(a=>put('archive',a.y,a));
  for(const t in db.reports)put('reports',t,Object.assign({trip:t},db.reports[t]));
  new Set([...Object.keys(db.check),...Object.keys(db.due)]).forEach(t=>put('workflow',t,{trip:t,check:JSON.stringify(db.check[t]||{}),due:JSON.stringify(db.due[t]||{})}));
  for(const t in db.teams)put('teams',t,{trip:t,teams:JSON.stringify(db.teams[t])});
  put('settings','forms',{key:'forms',value:JSON.stringify(db.forms||{})});
  return m}
function queueDiff(){
  const cur=ents(DB),ops=[];
  for(const k in cur)if(SNAP[k]!==cur[k]){const i=k.indexOf('|');ops.push({op:'upsert',coll:k.slice(0,i),rec:JSON.parse(cur[k])})}
  for(const k in SNAP)if(!(k in cur)){const i=k.indexOf('|');ops.push({op:'delete',coll:k.slice(0,i),key:k.slice(i+1)})}
  SNAP=cur;if(ops.length){Q.push(...ops);setSync('Saving…','');clearTimeout(flushT);flushT=setTimeout(flush,700)}
}
async function flush(){
  if(flushing||!Q.length)return;flushing=true;const ops=Q.splice(0,150);
  try{await api('batch',{ops});setSync(Q.length?'Saving…':'Saved to Google Sheet','ok')}
  catch(e){Q.unshift(...ops);setSync('Not saved. Tap to retry','err')}
  flushing=false;if(Q.length&&!/Not saved/.test(S.sync))flush();
}

const T=id=>DB.trips.find(t=>t.id===id);
const REG=id=>DB.regs.find(r=>r.id===id);
const regsOf=t=>DB.regs.filter(r=>r.trip===t.id);
const conf=t=>regsOf(t).filter(r=>r.status==='Confirmed');
const yearOf=t=>+t.start.slice(0,4);
const paidOf=r=>DB.ledger.filter(l=>l.pid===r.id&&l.dir==='in').reduce((a,l)=>a+(+l.amount||0),0);
const chk=(t,k)=>((DB.check[t.id]||{})[k]||{});
function stageProg(t,s){const its=items(t,s);const n=its.filter(x=>chk(t,x.key).done).length;return{n,of:its.length,full:n===its.length}}
function curStage(t){for(let s=0;s<9;s++)if(!stageProg(t,s).full)return s;return 9}
const passportBad=(t,r)=>t.overseas&&r.passportExp&&new Date(r.passportExp)<new Date(shift(t.end,182));
const payState=(t,r)=>{const p=paidOf(r);return p>=t.fee?['Paid in full','b-green']:p>0?['Partially paid','b-amber']:['Unpaid','b-red']};
const wRefund=w=>w.scenario==='A'?0:Math.max(0,(+w.paid||0)-(+w.nonrec||0));
function finance(t){
  const L=DB.ledger.filter(l=>l.trip===t.id);
  const inn=L.filter(l=>l.dir==='in').reduce((a,l)=>a+(+l.amount||0),0);
  const outs=L.filter(l=>l.dir==='out');
  const spent=outs.filter(l=>l.status!=='Reserved').reduce((a,l)=>a+(+l.amount||0),0);
  const reserved=outs.filter(l=>l.status==='Reserved').reduce((a,l)=>a+(+l.amount||0),0);
  const claims=outs.filter(l=>l.paidBy==='Personal (claim)'&&l.status==='Claim pending');
  const W=DB.withdrawals.filter(w=>w.trip===t.id);
  const wOut=W.filter(w=>w.choice!=='-').reduce((a,w)=>a+wRefund(w),0);
  const balance=inn-spent-reserved-wOut;
  return{inn,spent,reserved,claims,wOut,balance,perHead:conf(t).length?balance/conf(t).length:0,L};
}
const isUpcoming=t=>new Date(t.end)>=TODAY;
const isCancelled=t=>t&&t.status==='Cancelled';
const isClosed=t=>t&&t.closed==='Yes';
function closeChecks(t){const out=[],f=finance(t),r=DB.reports[t.id]||{};
  if(f.balance>=0.01)out.push({text:`Trip account must be RM0: ${rm(f.balance)} surplus to distribute`,go:{tab:'finance'}});
  else if(f.balance<=-0.01)out.push({text:`Trip account is short by ${rm(-f.balance)}: record a top-up or church subsidy`,go:{tab:'finance'}});
  if(f.claims.length)out.push({text:`${f.claims.length} personal claim${f.claims.length>1?'s':''} not settled`,go:{tab:'finance',f:'claims'}});
  if(!r.summary||!r.submitted)out.push({text:'Mission report not submitted (summary and date submitted)',go:{tab:'report'}});
  let n=0,first=null;for(let k=0;k<9;k++)items(t,k).forEach(x=>{if(x.key!=='c_close'&&!chk(t,x.key).done){n++;if(first===null)first=k}});
  if(n)out.push({text:`${n} checklist item${n>1?'s':''} not done`,go:{tab:'workflow',s:first}});
  return out}

function tLinks(t){if(t.tKey&&!(t.tLinks||[]).length){t.tLinks=[{key:t.tKey,name:'Treasurer',active:true,created:''}];t.tKey=''}if(!Array.isArray(t.tLinks))t.tLinks=[];return t.tLinks}
function phase(t){if(isCancelled(t))return 'cancelled';if(isClosed(t))return 'closed';if(new Date(t.end)<TODAY)return 'pending';return 'upcoming'}
const PHASE={upcoming:['Upcoming & in progress','b-ol'],pending:['Pending close-out','b-amber'],closed:['Closed','b-grey'],cancelled:['Cancelled','b-red']};
function nextStep(t){if(isClosed(t))return '';const s=curStage(t);if(s>=9)return closeChecks(t).length?'Next: '+closeChecks(t)[0].text:'Next: close the trip in Finance';const it=items(t,s).find(x=>!chk(t,x.key).done);return `Next: Step ${s+1} ${STAGES[s][0]}${it?' – '+it.text:''}`}
const ROLES=['Team Leader','Assistant Team Leader','Treasurer','Assistant Treasurer','Team Member'];
function roleSel(r,ro){const cur=r.role||'',other=cur&&!ROLES.includes(cur);return `<div class="row" style="flex-wrap:nowrap;gap:6px"><select class="inp" style="min-width:170px" data-set="role|${r.id}" ${ro}><option value=""></option>${ROLES.map(x=>`<option ${x===cur?'selected':''}>${x}</option>`).join('')}<option value="Other" ${other?'selected':''}>Other</option></select>${other?`<input class="inp" placeholder="Describe role" value="${cur==='Other'?'':esc(cur)}" data-set="reg|${r.id}|role" ${ro}>`:''}</div>`}
const LOWER=['bin','binti','bte','bt','a/l','a/p','s/o','d/o','al','van','de','der','da','dos'];
function properName(v){v=String(v??'').replace(/\s+/g,' ').trim();if(!v)return v;
  return v.split(' ').map((w,i)=>{const l=w.toLowerCase();if(i>0&&LOWER.includes(l))return l;return l.replace(/(^|[-'’(@.])([a-z\u00c0-\u024f])/g,(m,a,b)=>a+b.toUpperCase())}).join(' ')}
const NAMEF=['name','ecName','doctor'];

const tchips=(rs,cur)=>`<div class="tchips">${rs.map(x=>{const t=T(x.trip);return `<span class="tchip ${x.trip===cur?'now':''}">${esc(t.dest)} ${yearOf(t)}</span>`}).join('')}</div>`;
function formBtn(id,label){const f=FORMS[id];if(!f)return '';return `<button class="btn sm" data-act="form" data-f="${id}">⬇ ${esc(label||f.title)} (PDF)</button>`}
const forms=ids=>ids.length?`<div class="formsbar"><span>Forms</span>${ids.map(i=>`<button class="link" data-act="form" data-f="${i}">${esc(FORMS[i].title)} ↓</button>`).join('')}</div>`:'';
function attention(t){
  const out=[],s=curStage(t),c=conf(t);if(isCancelled(t))return out;
  if(isUpcoming(t)){
    const un=c.filter(r=>paidOf(r)<t.fee).length;
    if(s>=3&&un)out.push({sev:'r',text:`${un} participant${un>1?'s':''} not yet paid in full`,go:{tab:'people',f:'unpaid'}});
    if(t.overseas&&s>=4){const n=c.filter(r=>!r.insurer).length;if(n)out.push({sev:'r',text:`${n} without travel insurance (compulsory overseas)`,go:{tab:'people',f:'noins'}})}
    const pb=c.filter(r=>passportBad(t,r)).length;if(pb)out.push({sev:'r',text:`${pb} passport${pb>1?'s expire':' expires'} within 6 months of return`,go:{tab:'people',f:'passport'}});
    if(s>=3){const tm=DB.teams[t.id]||[];const miss=tm.filter(g=>!g.treasurer||!g.leader).length;if(!tm.length)out.push({sev:'w',text:'Teams and treasurers not set up yet',go:{tab:'teams'}});else if(miss)out.push({sev:'r',text:`${miss} team${miss>1?'s have':' has'} no leader or treasurer`,go:{tab:'teams'}})}
    for(let k=0;k<9;k++){const due=(DB.due[t.id]||{})[k];if(due&&new Date(due)<TODAY&&!stageProg(t,k).full){out.push({sev:'r',text:`Step ${k+1} ${STAGES[k][0]} overdue (due ${fd(due)})`,go:{tab:'workflow',s:k}});break}}
    if(s<9)out.push({sev:'w',text:`Now at step ${s+1}: ${STAGES[s][1].toLowerCase()} (${stageProg(t,s).n}/${stageProg(t,s).of})`,go:{tab:'workflow',s}});
  }
  const f=finance(t);if(f.claims.length)out.push({sev:'r',text:`${f.claims.length} personal payment claim${f.claims.length>1?'s':''} pending (${rm(f.claims.reduce((a,l)=>a+ +l.amount,0))})`,go:{tab:'finance',f:'claims'}});
  if(!isUpcoming(t)&&!isClosed(t)){const cc=closeChecks(t);if(!cc.length)out.push({sev:'w',text:'Ready to close: open Finance and close the trip',go:{tab:'finance'}});else cc.forEach(c=>out.push({sev:'w',text:'To close: '+c.text,go:c.go}))}
  return out;
}

const gStep=(t,s)=>{const d=(DB.due[t.id]||{})[s];return d?gcal(`TOW ${t.dest} ${yearOf(t)}: Step ${s+1} ${STAGES[s][1]}`,d,shift(d,1),`Mission step due. Trip code ${t.id}`,''):''};
function ics(t){
  const ev=(uidv,title,a,b,desc)=>`BEGIN:VEVENT\r\nUID:${uidv}@towmissions\r\nDTSTAMP:${ymd(new Date().toISOString())}T000000Z\r\nDTSTART;VALUE=DATE:${ymd(a)}\r\nDTEND;VALUE=DATE:${ymd(b)}\r\nSUMMARY:${title}\r\nDESCRIPTION:${desc}\r\nEND:VEVENT\r\n`;
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//TOW Missions Trip//EN\r\n';
  s+=ev(t.id+'-trip',`TOW Mission: ${t.dest} ${yearOf(t)}`,t.start,shift(t.end,1),`PIC ${t.pic}`);
  STAGES.forEach((st,i)=>{const d=(DB.due[t.id]||{})[i];if(d)s+=ev(`${t.id}-s${i}`,`TOW ${t.dest}: Step ${i+1} ${st[1]}`,d,shift(d,1),'Mission step due')});
  return s+'END:VCALENDAR\r\n';
}
async function saveFile(name,text,mime){ /* text may be string or Uint8Array */

function tripRow(t){const c=isCancelled(t),ns=c?'':nextStep(t);return `<button class="triprow" data-act="trip" data-id="${t.id}"><div><div class="tname">${esc(t.dest)}${c?' <span class="small muted">(cancelled)</span>':''}</div><div class="tmeta">${fr(t.start,t.end)} · ${conf(t).length} going · PIC ${esc(t.pic||'not set')}</div>${c?`<div class="next" style="color:var(--red)">${esc(t.cancelReason||'Trip cancelled')}</div>`:ns&&phase(t)!=='closed'?`<div class="next">${esc(ns)}</div>`:''}</div><div>${statusBadge(t)}</div>${c?'':segs(t)}</button>`}
function yearRows(){
  const rows=DB.archive.map(a=>({y:+a.y,pax:+a.pax,trips:+a.trips,dest:a.dest,funds:+a.funds,kind:'arch'}));
  [...new Set(DB.trips.map(yearOf))].forEach(y=>{const ts=DB.trips.filter(t=>yearOf(t)===y&&!isCancelled(t));const r={y,trips:ts.length,pax:ts.reduce((a,t)=>a+conf(t).length,0),dest:[...new Set(ts.map(t=>t.dest))].join(', '),funds:ts.reduce((a,t)=>a+finance(t).inn,0),kind:y>TODAY.getFullYear()?'plan':'live'};const i=rows.findIndex(x=>x.y===y);if(i>=0)rows[i]=r;else rows.push(r)});
  return rows.sort((a,b)=>a.y-b.y);
}
function chart(){
  const rows=yearRows().slice(-10);if(!rows.length)return '<p class="empty">No data yet.</p>';
  const W=560,H=200,pad=20,bw=(W-pad*2)/rows.length,max=Math.max(...rows.map(r=>r.pax),10);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="People sent per year"><g class="bars">${rows.map((r,i)=>{const h=r.pax/max*(H-60),x=pad+i*bw+bw*.18,y=H-28-h;
    return `<rect class="${r.kind}" x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(h,1)}" rx="3"/><text class="val" x="${x+bw*.32}" y="${y-6}" text-anchor="middle">${r.pax||'–'}</text><text x="${x+bw*.32}" y="${H-10}" text-anchor="middle">${r.y}${r.kind==='plan'?'*':''}</text>`}).join('')}</g></svg>
  <p class="small muted" style="margin:6px 0 0">Olive: full trip records. Grey: yearly totals only. * Registrations so far.</p>`;
}
function topDest(){
  const c={};DB.archive.forEach(a=>String(a.dest).split(',').map(s=>s.trim()).forEach(d=>{if(d&&!d.startsWith('No'))c[d]=(c[d]||0)+1}));DB.trips.forEach(t=>c[t.dest]=(c[t.dest]||0)+1);
  const arr=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6);if(!arr.length)return '<p class="muted">No trips yet.</p>';const max=arr[0][1];

}

    report:()=>{const r=DB.reports[t.id]||{};return `<div class="row"><button class="btn sm pri" data-act="tab" data-t="report">${r.summary?'Open mission report':'Fill in mission report'}</button>${formBtn('report')}<span class="small muted">${r.submitted?'Submitted '+fd(r.submitted):r.summary?'Draft started':'Not started'}</span></div>`}
  };

function findDups(){
  const groups={};DB.regs.forEach(r=>{if(!r.trip)return;const k=r.trip+'#'+pkey(r);(groups[k]=groups[k]||[]).push(r)});
  const regDup=Object.values(groups).filter(g=>g.length>1);
  const lk=l=>[l.trip,l.date,l.dir,l.cat,(l.desc||'').trim(),+l.amount].join('|');
  return {regDup,count:regDup.reduce((a,g)=>a+g.length-1,0),lk};
}
function cleanDups(){
  const {regDup,lk}=findDups(),filled=r=>Object.values(r).filter(v=>v!==''&&v!=null).length,remap={};let nr=0,nl=0,nw=0;
  regDup.forEach(g=>{
    const keep=[...g].sort((a,b)=>(a.destAnswer?0:1)-(b.destAnswer?0:1)||filled(b)-filled(a))[0];
    g.filter(r=>r!==keep).forEach(d=>{
      for(const k in d)if((keep[k]===''||keep[k]==null)&&d[k]!==''&&d[k]!=null&&!/[*•]/.test(String(d[k])))keep[k]=d[k];
      if(d.status==='Withdrawn')keep.status='Withdrawn';
      remap[d.id]=keep.id;nr++});
  });
  DB.ledger.forEach(l=>{if(remap[l.pid])l.pid=remap[l.pid]});
  DB.withdrawals.forEach(w=>{if(remap[w.pid])w.pid=remap[w.pid]});
  for(const t in DB.teams)(DB.teams[t]||[]).forEach(g=>{if(remap[g.leader])g.leader=remap[g.leader];if(remap[g.treasurer])g.treasurer=remap[g.treasurer]});
  const gmap={};DB.regs.forEach(r=>{if(remap[r.id]&&r.group)gmap[remap[r.id]]=gmap[remap[r.id]]||r.group});
  DB.regs=DB.regs.filter(r=>!remap[r.id]);DB.regs.forEach(r=>{if(!r.group&&gmap[r.id])r.group=gmap[r.id]});
  const seen=new Set();DB.ledger=DB.ledger.filter(l=>{const k=lk(l)+'|'+(l.pid||'');if(seen.has(k)){nl++;return false}seen.add(k);return true});
  const sw=new Set();DB.withdrawals=DB.withdrawals.filter(w=>{const k=w.trip+'|'+w.pid;if(sw.has(k)){nw++;return false}sw.add(k);return true});
  save();log('Cleaned up duplicates',`${nr} participants, ${nl} finance rows, ${nw} withdrawals`);
  return {nr,nl,nw};
}
function moneyHistory(r){
  const regs=DB.regs.filter(x=>pkey(x)===pkey(r)&&T(x.trip)).sort((a,b)=>T(a.trip).start<T(b.trip).start?1:-1);
  let tc=0,tr=0;
  const rows=regs.map(x=>{const t=T(x.trip),w=DB.withdrawals.find(v=>v.pid===x.id),paid=Math.max(paidOf(x),w?(+w.paid||0):0);let ref=0,rem=[];
    if(w){const amt=wRefund(w);if(w.choice==='Refund'){ref+=amt;rem.push(`Withdrawal refund, Scenario ${w.scenario}${w.comp==='Yes'?' + D':''}${w.status?' ('+w.status+')':''}`)}else if(w.choice.startsWith('Donate'))rem.push(`Withdrew; ${rm(amt)} donated to Mission Fund`);else rem.push('Withdrew before paying')}
    else if(isCancelled(t))rem.push('Trip cancelled'+(paid?'; record the refund as a withdrawal':''));
    else if(x.status==='Confirmed'){const mine=DB.ledger.filter(l=>l.trip===t.id&&l.pid===x.id&&l.dir==='out');const sr=mine.filter(l=>l.cat==='Surplus refund'),dn=mine.filter(l=>l.cat==='Donation to church');
      if(sr.length){const a=sr.reduce((q,l)=>q+ +l.amount,0);ref+=a;rem.push('Surplus refund '+fd(sr[0].date))}
      if(dn.length)rem.push(`Surplus share ${rm(dn.reduce((q,l)=>q+ +l.amount,0))} donated to church`);
      if(!sr.length&&!dn.length)rem.push(isClosed(t)?'No surplus':new Date(t.end)<TODAY?(finance(t).perHead>0.009?`Waiting for close-out (about ${rm(finance(t).perHead)} each)`:'Waiting for close-out'):'Trip upcoming')}
    tc+=paid;tr+=ref;
    return `<tr><td><button class="link" data-act="profile" data-id="${x.id}">${esc(t.dest)} ${yearOf(t)}</button>${x.id===r.id?' <span class="tchip now">this</span>':''}</td><td class="num">${rm(paid)}</td><td class="num">${ref?rm(ref):'—'}</td><td class="small">${esc(rem.join('; '))}</td></tr>`}).join('');
  return `<div class="tbl"><table class="sm"><thead><tr><th>Trip</th><th class="num">Contributed</th><th class="num">Refunded</th><th>Remarks</th></tr></thead><tbody>${rows}<tr class="total"><td>Total</td><td class="num">${rm(tc)}</td><td class="num">${rm(tr)}</td><td></td></tr></tbody></table></div>`;
}

function printTrip(t){
  const f=finance(t),tm=DB.teams[t.id]||[],W=DB.withdrawals.filter(w=>w.trip===t.id),c=conf(t);
  const head=(title,sub)=>`<img class="lg" src="${LOGO_FULL}" alt=""><div class="tt">${title}</div>${sub?`<div class="st">${sub}</div>`:'<div class="st">&nbsp;</div>'}`;
  const tripbox=`<table class="tb"><tr><td><span>Destination</span>${esc(t.dest)}, ${esc(t.country)}</td><td><span>Trip code</span>${esc(t.id)}${isCancelled(t)?' (CANCELLED)':''}</td></tr><tr><td><span>Trip dates</span>${fr(t.start,t.end)}</td><td><span>PIC / A.PIC</span>${esc(t.pic||'')} / ${esc(t.apic||'')}</td></tr></table>`;
  const foot=n=>`<div class="ft">TOW Missions Trip &nbsp;|&nbsp; ${n} &nbsp;|&nbsp; ${esc(t.dest)} ${yearOf(t)} (${esc(t.id)})</div>`;
  const page=(html,first)=>`<div class="wfp" ${first?'':'style="page-break-before:always"'}>${html}</div>`;
  // cover
  const tot=f.L.filter(l=>l.dir==='in').reduce((a,l)=>a+ +l.amount,0);
  const cover=head('MISSION TRIP PACK',`Complete record of the ${esc(t.dest)} ${yearOf(t)} mission trip. Printed ${fd(new Date().toISOString())}.`)+tripbox+
   `<div class="sh">SUMMARY</div><table class="tb"><tr><td><span>Participants</span>${c.length} travelled${W.length?`, ${W.length} withdrew`:''}</td><td><span>Status</span>${isClosed(t)?'Closed '+fd(t.closedAt):isCancelled(t)?'Cancelled':'Open'}</td></tr>
   <tr><td><span>Money in</span>${rm(tot)}</td><td><span>Money out (spent + reserved)</span>${rm(f.spent+f.reserved)}</td></tr><tr><td><span>Withdrawal refunds / donations</span>${rm(f.wOut)}</td><td><span>Balance</span><b>${rm(f.balance)}</b></td></tr></table>
   <div class="sh">CONTENTS</div><table class="ck"><tbody>${['Mission Trip Report','Participants List','Teams & Roles','Financial Statement','Withdrawals','Mission Team Workflow Checklist'].map((x,i)=>`<tr><td class="c" style="font-size:8.5pt">${i+1}</td><td>${x}</td></tr>`).join('')}</tbody></table>`+foot('Trip Pack');
  // participants
  const parts=head('MISSION TRIP PARTICIPANTS LIST')+tripbox+`<div class="sh">PARTICIPANTS (${c.length})</div><table class="ck"><thead><tr><th class="c">No</th><th>Full name (as per IC)</th><th>Mobile</th><th>Team</th><th>Role</th><th style="text-align:right">Paid (RM)</th></tr></thead><tbody>
   ${c.map((r,i)=>`<tr><td class="c" style="font-size:8.5pt">${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.mobile||'')}</td><td>${esc((tm.find(g=>g.id===r.group)||{}).name||'')}</td><td>${esc(r.role||'')}</td><td class="r">${rm(paidOf(r)).replace('RM','')}</td></tr>`).join('')}
   <tr class="tot"><td></td><td colspan="4"><b>Total contributions</b></td><td class="r"><b>${rm(c.reduce((a,r)=>a+paidOf(r),0)).replace('RM','')}</b></td></tr></tbody></table>`+foot('Participants List');
  // teams
  const teams=head('TEAMS & ROLES','The PIC + Treasurer and the A.PIC + Assistant Treasurer must stay together at all times, so every expense is paid and recorded by a treasurer.')+tripbox+
   (tm.length?tm.map(g=>{const mem=c.filter(r=>r.group===g.id);return `<div class="sh">${esc(g.name).toUpperCase()}</div><table class="tb"><tr><td><span>Leader</span>${esc((REG(g.leader)||{}).name||'')}</td><td><span>Treasurer</span>${esc((REG(g.treasurer)||{}).name||'')}</td></tr></table><table class="ck" style="table-layout:fixed"><thead><tr><th style="width:60%">Members</th><th>Ministry role</th></tr></thead><tbody>${mem.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.role||'')}</td></tr>`).join('')||'<tr><td>&nbsp;</td><td></td></tr>'}</tbody></table>`}).join(''):'<div class="sh">TEAMS</div><p>No teams recorded.</p>')+foot('Teams & Roles');
  // finance
  let bal=0;const L=[...f.L].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const fin=head('MISSION FINANCIAL STATEMENT','Every transaction for this trip in date order, with the running balance.')+tripbox+`<div class="sh">TRANSACTIONS</div><table class="ck"><thead><tr><th style="width:12%">Date</th><th>Description</th><th style="width:13%;text-align:right">Credit (in) RM</th><th style="width:13%;text-align:right">Debit (out) RM</th><th style="width:15%;text-align:right">Running balance RM</th></tr></thead><tbody>
   ${L.map(l=>{if(l.status!=='Reserved')bal+=(l.dir==='in'?1:-1)*(+l.amount||0);return `<tr><td>${fd(l.date)}</td><td>${esc(l.cat)}: ${esc(l.desc)}${l.pid&&REG(l.pid)?' · '+esc(REG(l.pid).name):''}${l.status==='Reserved'?' (reserved)':''}${l.source==='Treasurer link'?' · via '+esc(l.enteredBy||'treasurer'):''}</td><td class="r">${l.dir==='in'?rm(l.amount).replace('RM',''):''}</td><td class="r">${l.dir==='out'?rm(l.amount).replace('RM',''):''}</td><td class="r"><b>${l.status==='Reserved'?'—':rm(bal).replace('RM','')}</b></td></tr>`}).join('')||'<tr><td colspan="5">No transactions.</td></tr>'}
   <tr class="tot"><td></td><td><b>Totals</b></td><td class="r"><b>${rm(f.inn).replace('RM','')}</b></td><td class="r"><b>${rm(f.spent+f.reserved).replace('RM','')}</b></td><td class="r"><b>${rm(f.inn-f.spent-f.reserved).replace('RM','')}</b></td></tr></tbody></table>
   <table class="tb" style="margin-top:8pt"><tr><td><span>Total credit (RM)</span>${rm(f.inn)}</td><td><span>Total debit (RM)</span>${rm(f.spent+f.reserved)}</td><td><span>Withdrawal refunds (RM)</span>${rm(f.wOut)}</td><td><span>Closing balance (RM)</span><b>${rm(f.balance)}</b></td></tr></table>

  // withdrawals
  const wd=head('MISSION TRIP WITHDRAWALS','Refunds follow the TOW Mission Trip Cancellation & Refund Policy. No planning fee.')+tripbox+`<div class="sh">WITHDRAWALS (${W.length})</div><table class="ck"><thead><tr><th>Name</th><th>Notified</th><th>Scenario</th><th>Reason</th><th style="text-align:right">Paid RM</th><th style="text-align:right">Non-recoverable RM</th><th style="text-align:right">Refund RM</th><th>Choice / status</th></tr></thead><tbody>
   ${W.map(w=>`<tr><td>${esc((REG(w.pid)||{}).name||'')}</td><td>${fd(w.date)}</td><td>${esc(w.scenario)}${w.comp==='Yes'?' + D':''}</td><td>${esc(w.reason||'')}</td><td class="r">${rm(w.paid).replace('RM','')}</td><td class="r">${rm(w.nonrec).replace('RM','')}</td><td class="r"><b>${rm(wRefund(w)).replace('RM','')}</b></td><td>${esc(w.choice)}${w.status?' · '+esc(w.status):''}</td></tr>`).join('')||'<tr><td colspan="8">No one withdrew from this trip.</td></tr>'}</tbody></table>`+foot('Withdrawals');
  const strip=h=>h.replace(/^<div class="wfp">/,'').replace(/<\/div>$/,'');
  $('#print').innerHTML=page(cover,true)+`<div class="wfp" style="page-break-before:always">${strip(printReport(t,true))}</div>`+page(parts)+page(teams)+page(fin)+page(wd)+`<div class="wfp" style="page-break-before:always">${strip(printWorkflow(t,true))}</div>`;
  log('Printed trip pack',`${t.dest} ${yearOf(t)}`);
  doPrint();
}

  ${STAGES.map((st,i)=>`<div class="sh">STEP ${i+1}: ${st[1].toUpperCase()}${(DB.due[t.id]||{})[i]?` <span>(due ${fd(DB.due[t.id][i])})</span>`:''}</div><table class="ck"><thead><tr><th class="c"></th><th class="i">Item</th><th class="w">Who / notes</th><th class="d">Date done</th></tr></thead><tbody>${items(t,i).map(x=>{const c=chk(t,x.key),done=x.key==='c_close'?isClosed(t):c.done,v=bv(x);return `<tr><td class="c">${done?TK:BX}</td><td>${esc(x.text)}</td><td>${esc(c.detail||'')}</td><td>${done&&c.at?fd(c.at):''}</td></tr>${v?`<tr class="bd"><td></td><td colspan="3">${v}</td></tr>`:''}`}).join('')}</tbody></table>`).join('')}

async function doPrint(){
  const imgs=[...document.querySelectorAll('#print img')];
  await Promise.race([Promise.all(imgs.map(i=>i.complete&&i.naturalWidth?null:(i.decode?i.decode().catch(()=>{}):new Promise(r=>{i.onload=i.onerror=r})))),new Promise(r=>setTimeout(r,1500))]);
  await new Promise(r=>setTimeout(r,250));
  try{window.print()}catch(e){alert('Printing is blocked in this preview. It works on the GitHub version.')}
}

    ['status','role'].forEach(key=>{if(v[key]!==r[key]){ch.push(key);r[key]=v[key]}});
    if(ch.length){save();log('Edited profile',`${r.name}: ${ch.join(', ')}`)}modal(vProfile(r.id));render();return}
  if(k==='reveal'){const id=f.dataset.id,r=REG(id),lbl=`${r.name} (${T(r.trip).dest} ${yearOf(T(r.trip))})`;let ok=null;
    if(BE()){try{const j=await api('reveal',{id,pw:v.pw,ip:await getIP(),dev:device()});ok={ic:j.ic,passport:j.passport}}catch(err){$('#rerr').textContent=err.message;return}}
    else{const u=me();if(await sha(u.salt+v.pw)===u.hash){ok={ic:r.ic,passport:r.passport};await log('Viewed full IC',lbl)}else{$('#rerr').textContent='Wrong password.';log('Failed IC unlock',r.name);return}}
    S.revealed[id]=ok;modal(vProfile(id));clearTimeout(S.revealT);S.revealT=setTimeout(()=>{S.revealed={};const sh=$('#modal form[data-form=regedit]');if($('#modal .sheet')&&!sh)modal(vProfile(id))},30000);return}
  if(k==='pay'){const r=REG(f.dataset.id);DB.ledger.push({id:uid(),trip:r.trip,date:v.date,dir:'in',cat:'Participant contribution',desc:'Payment',amount:num(v.amount),pid:r.id,paidBy:'',status:'Paid',ref:v.ref});save();log('Recorded payment',`${r.name} ${rm(v.amount)}`);modal(vProfile(r.id));render();return}
  if(k==='ledger'){const t=T(f.dataset.id);const rec={trip:t.id,date:v.date,dir:v.dir,cat:v.cat,desc:v.desc,amount:num(v.amount),pid:v.pid||'',paidBy:v.dir==='out'?v.paidBy:'',status:v.dir==='out'?v.status:'Paid',ref:v.ref||'',receipt:v.receipt||''};
    if(f.dataset.l)Object.assign(DB.ledger.find(l=>l.id===f.dataset.l),rec);else DB.ledger.push({id:uid(),...rec});save();log(f.dataset.l?'Edited finance entry':'Added finance entry',`${t.dest} ${yearOf(t)}: ${v.cat} ${rm(v.amount)}`);closeModal();render();return}
  if(k==='withdraw'){const t=T(f.dataset.id);const rec={trip:t.id,pid:v.pid,date:v.date,scenario:v.scenario,comp:v.comp,reason:v.reason,paid:num(v.paid),nonrec:num(v.nonrec),fee:0,choice:v.choice,status:v.status};
    if(f.dataset.w)Object.assign(DB.withdrawals.find(w=>w.id===f.dataset.w),rec);else DB.withdrawals.push({id:uid(),...rec});REG(v.pid).status='Withdrawn';save();log('Recorded withdrawal',`${REG(v.pid).name} (${t.dest} ${yearOf(t)})`);closeModal();go({trip:t.id,tab:'withdrawals'});return}
  if(k==='trip'){let id=f.dataset.id;const data={dest:v.dest.trim(),country:v.country.trim(),overseas:v.overseas==='1',start:v.start,end:v.end,fee:num(v.fee),deposit:num(v.deposit),status:v.status,cancelReason:v.status==='Cancelled'?v.cancelReason:''};
    if(id){Object.assign(T(id),data)}else{id=(v.id||`${v.start.slice(0,4)}-${data.dest.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()}`).trim();if(T(id))id+='-'+uid().slice(0,2).toUpperCase();
      DB.trips.push({id,...data,pic:'',apic:'',mealMode:data.overseas?'Allowance':'Actual bill',media:''});DB.check[id]={};DB.due[id]={};STAGES.forEach((_,s)=>DB.due[id][s]=shift(v.start,DUE_OFF[s]))}
    autoLink();save();log(f.dataset.id?'Edited trip':'Created trip',id);closeModal();go({trip:id,tab:'workflow',stage:null});return}
  if(k==='arch'){const a={y:+v.y,trips:+v.trips,pax:+v.pax,funds:num(v.funds),dest:v.dest};const i=DB.archive.findIndex(x=>+x.y===a.y);if(i>=0)DB.archive[i]=a;else DB.archive.push(a);save();log('Saved past-year totals',String(a.y));render();return}
  if(k==='access'){const id=f.dataset.u,trips=[...f.querySelectorAll('input[name=trip]:checked')].map(x=>x.value),acc={role:v.role,access:v.access==='View'?'View':'Edit',trips:v.role==='PIC'?trips:[]};
    if(BE()){try{await api('setaccess',Object.assign({id},acc));closeModal();S.adm=null;render()}catch(err){alert(err.message)}return}
    const u=DB.users.find(x=>x.id===id);if(u){Object.assign(u,acc);save();log('Changed access',`${id}: ${acc.role}`)}closeModal();render();return}
  if(k==='user'&&BE()){try{await api('adduser',{id:v.id,name:v.name,role:v.role,pw:v.pw});S.adm=await api('admin');render();if(v.role==='PIC')modal(vAccess(v.id),true)}catch(err){alert(err.message)}return}
  if(k==='user'){if(DB.users.find(u=>u.id.toLowerCase()===v.id.toLowerCase())){alert('That user ID already exists.');return}const salt=uid();DB.users.push({id:v.id,name:v.name,role:v.role,salt,hash:await sha(salt+v.pw),created:new Date().toISOString(),trips:[],access:'Edit'});save();log('Added user',`${v.id} (${v.role})`);render();if(v.role==='PIC')modal(vAccess(v.id),true);return}
  if(k==='settings'){const was=BE();if(!BACKEND_URL)DB.settings.backend=(v.backend||'').trim();DB.settings.driveRoot=v.driveRoot.trim();await log('Changed settings');
    if(BE()!==was){try{localStorage.setItem(STORE,JSON.stringify(BE()?{settings:DB.settings}:Object.assign(emptyDB(),{settings:DB.settings})))}catch(x){}alert(BE()?'Connected. Sign in with your Google Sheet user account.':'Disconnected from Google Sheet.');ME=null;S.token=null;S.user=null;SNAP=null;try{sessionStorage.clear()}catch(x){}load();render();return}
    save();render();return}
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-accrole]')){const pic=e.target.value==='PIC',m=$('#modal');m.querySelector('[data-acctrips]').hidden=!pic;const n=m.querySelector('[data-accnote]');n.hidden=pic;n.textContent=e.target.value+' users see every trip.';return}
  const el=e.target;
  if(el.dataset.imp!==undefined&&el.files[0]){doImport(el.files[0]).catch(err=>{$('#impres').textContent='Could not read that file: '+err.message});return}
  if(el.hasAttribute('data-lf')){S.lf=el.value;render();return}
  if(el.hasAttribute('data-dir')){const f=el.closest('form');const t=T(f.dataset.id);const l=f.dataset.l?{...DB.ledger.find(x=>x.id===f.dataset.l)}:{date:f.date.value,desc:f.desc.value,amount:f.amount.value};l.dir=el.value;l.cat=(el.value==='in'?IN_CATS:OUT_CATS)[0];l.paidBy=l.paidBy||'Church account';l.status=l.status||'Paid';const id=l.id;modal(vLedgerForm(t,l),true);if(id)$('#modal form').dataset.l=id;return}
  if(el.hasAttribute('data-calc')){const f=el.closest('form');f.refund.value=wRefund({scenario:f.scenario.value,paid:f.paid.value,nonrec:f.nonrec.value});return}
  const s=el.dataset.set;if(!s)return;const p=s.split('|');
  if(p[0]==='done'){const c=(DB.check[p[1]]=DB.check[p[1]]||{});c[p[2]]=Object.assign(c[p[2]]||{},{done:el.checked,by:(me()||{}).id,at:new Date().toISOString()})}
  else if(p[0]==='detail'){S.rmk=null;const c=(DB.check[p[1]]=DB.check[p[1]]||{});c[p[2]]=Object.assign(c[p[2]]||{},{detail:el.value})}
  else if(p[0]==='due'){(DB.due[p[1]]=DB.due[p[1]]||{})[p[2]]=el.value}
  else if(p[0]==='list'){const t=T(p[1]);const L=t[p[2]]=t[p[2]]||[];if(L[+p[3]])L[+p[3]][p[4]]=p[4]==='amt'?num(el.value):p[4]==='name'?properName(el.value):el.value}
  else if(p[0]==='formlink'){DB.forms=DB.forms||{};DB.forms[p[1]]=el.value.trim();log('Changed form link',FORMS[p[1]].title)}
  else if(p[0]==='trip'){const t=T(p[1]);if(['pic','apic'].includes(p[2]))el.value=properName(el.value);t[p[2]]=['fee','deposit','mealB','mealL','mealD','budgetPax'].includes(p[2])?num(el.value):['surplusAmt','surplusPax'].includes(p[2])?(el.value===''?'':num(el.value)):el.value;if((p[2]==='pic'||p[2]==='apic')&&el.value){const c=(DB.check[t.id]=DB.check[t.id]||{});c[p[2]]={done:true,by:(me()||{}).id}}}
  else if(p[0]==='role'){const r=REG(p[1]);r.role=el.value==='Other'?(ROLES.includes(r.role)||!r.role?'Other':r.role):el.value}
  else if(p[0]==='reg'){REG(p[1])[p[2]]=el.value}
  else if(p[0]==='team'){const g=DB.teams[p[1]].find(x=>x.id===p[2]);g[p[3]]=el.value;if(el.value){const r=REG(el.value),i=DB.teams[p[1]].indexOf(g);r.group=g.id;r.role=p[3]==='treasurer'?(i===0?'Treasurer':'Assistant Treasurer'):(i===1?'Assistant Team Leader':'Team Leader')}}
  save();render();
});
document.addEventListener('focusout',e=>{if(e.target.hasAttribute&&e.target.hasAttribute('data-rmk'))setTimeout(()=>{if(S.rmk&&!document.querySelector('[data-rmk]:focus')){S.rmk=null;render()}},150)});
let tmr;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.hasAttribute('data-surp')){const fm=el.closest('form'),B=+$('#surp-left').dataset.b;let tot=0;fm.querySelectorAll('[data-surp]').forEach(i=>tot+=num(i.value));$('#surp-left').textContent=rm(B-tot);return}
  if(el.hasAttribute('data-q')){S.q=el.value;const pos=el.selectionStart;render();const i=$('[data-q]');i.focus();i.setSelectionRange(pos,pos);return}
  const r=el.dataset.rep;if(!r)return;const [id,k]=r.split('|');(DB.reports[id]=DB.reports[id]||{})[k]=el.value;
  clearTimeout(tmr);tmr=setTimeout(()=>{save();const s=$('#saved');if(s)s.textContent='Report saved'},500);

document.addEventListener('toggle',e=>{if(e.target.hasAttribute&&e.target.hasAttribute('data-hist')){S.histOpen=e.target.open;return}if(e.target.hasAttribute&&e.target.hasAttribute('data-flow')){S.flowOpen=e.target.open;try{localStorage.setItem('towmt-flow',S.flowOpen?'1':'0')}catch(x){}}},true);
try{if(localStorage.getItem('towmt-flow')==='0')S.flowOpen=false}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.hasAttribute&&e.target.hasAttribute('data-rmk')){e.preventDefault();e.target.blur();return}if(e.key==='Escape'&&S.rmk){S.rmk=null;render();return}if(e.key==='Escape'&&$('#modal').innerHTML){closeModal();render()}});

function idle(){const a=document.activeElement;return !$('#modal').innerHTML&&!Q.length&&!flushing&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))}
async function refresh(){if(!BE()||!S.token||!idle())return;try{await loadRemote();if(idle())render()}catch(e){}}
setInterval(refresh,120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});

(async()=>{
  load();
  if(BE()){try{let ss=JSON.parse(sessionStorage.getItem('towmt-sess')||'null')||JSON.parse(localStorage.getItem('towmt-sess')||'null');
    if(ss&&ss.t&&Date.now()-ss.t>6*3600e3){ss=null;localStorage.removeItem('towmt-sess')}
    if(ss){S.token=ss.token;S.user=ss.user;$('#root').innerHTML='<div class="login"><div class="card" style="text-align:center"><img src="'+LOGO_FULL+'" alt=""><p class="muted">Loading trips…</p></div></div>';await loadRemote()}}catch(e){S.token=null;S.user=null}}
  render();getIP();
})();
