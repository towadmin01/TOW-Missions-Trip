<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5985a">
<title>TOW Mission Treasurer</title>
<style>
:root{--bg:#f5f5f1;--surface:#fff;--ink:#26251f;--muted:#69665a;--line:#e1ded2;--gold:#b5985a;--gold-ink:#7a6230;--gold-soft:#f5eedf;--green:#2f7a55;--green-soft:#e2f0e8;--red:#b0432f;--red-soft:#f8e4df;--amber:#9a6a00;--amber-soft:#fbefd2;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a16;--surface:#23231e;--ink:#ecebe2;--muted:#a6a392;--line:#3a3931;--gold:#c9ad6e;--gold-ink:#dcc48e;--gold-soft:#3a3123;--green:#6cc196;--green-soft:#1f3229;--red:#e98a75;--red-soft:#3d2520;--amber:#e6b85a;--amber-soft:#3a2f17}}
:root[data-theme="dark"]{--bg:#1a1a16;--surface:#23231e;--ink:#ecebe2;--muted:#a6a392;--line:#3a3931;--gold:#c9ad6e;--gold-ink:#dcc48e;--gold-soft:#3a3123;--green:#6cc196;--green-soft:#1f3229;--red:#e98a75;--red-soft:#3d2520;--amber:#e6b85a;--amber-soft:#3a2f17}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
header img{height:36px}
header b{font-size:17px}
.trip{font-size:14px;color:var(--muted);margin-bottom:12px}
.net{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:6px}
.on{background:var(--green-soft);color:var(--green)}.off{background:var(--amber-soft);color:var(--amber)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
input,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.btn{width:100%;border:0;background:var(--gold);color:#fff;font-weight:800;border-radius:12px;padding:14px;margin-top:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum div{background:var(--gold-soft);border-radius:10px;padding:8px}
.sum span{display:block;font-size:11px;color:var(--muted)}.sum b{font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.num{text-align:right;white-space:nowrap}
.q{font-size:11px;font-weight:700;color:var(--amber)}.s{font-size:11px;font-weight:700;color:var(--green)}
.note{font-size:13px;color:var(--muted)}
.warn{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px}
.tiny{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>

<div class="wrap" id="app"></div>

const P=new URLSearchParams(location.search),TRIP=P.get('trip')||'',KEY=P.get('key')||'';
let API='';try{API=atob(P.get('api')||'')}catch(e){}
const SK='towt-'+TRIP;
const IN=['Love gift from local church','Sponsorship','Funds received from PIC','Other income'];
const OUT=['Meals - allowance','Meals - actual bill','Transport - vehicle rental','Transport - taxi/Grab','Accommodation','Love gift to local church','Ministry materials','Luggage','Others'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rm=n=>'RM'+(Math.round((+n||0)*100)/100).toLocaleString('en-MY',{maximumFractionDigits:2});
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let S={name:'',info:null,entries:[]};try{S=Object.assign(S,JSON.parse(localStorage.getItem(SK)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
let dir='out',busy=false,msg='';

async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const j=await r.json();if(j.error)throw new Error(j.error);return j}
async function sync(){
  if(busy||!API||!navigator.onLine)return;busy=true;
  try{
    if(!S.info){S.info=await call({action:'tInfo',trip:TRIP,key:KEY});save()}
    const q=S.entries.filter(e=>!e.sent);
    if(q.length){const j=await call({action:'tEntry',trip:TRIP,key:KEY,name:S.name,entries:q.map(({sent,...e})=>e)});(j.saved||[]).forEach(id=>{const e=S.entries.find(x=>x.id===id);if(e)e.sent=true});save();msg=''}
  }catch(e){msg=(e instanceof TypeError||/fetch|network|load failed/i.test(e.message))?'':e.message}
  busy=false;render();
}
function render(){
  const app=$('#app');
  const head=`<header><img src="${LOGO}" alt=""><b>TOW Mission Treasurer</b></header>
   <div class="trip">${S.info?esc(S.info.title):esc(TRIP)} <span class="net ${navigator.onLine?'on':'off'}">${navigator.onLine?'Online':'Offline: entries are kept on this phone'}</span></div>`;
  if(!TRIP||!KEY||!API){app.innerHTML=head+'<div class="warn">This link is incomplete. Ask the trip PIC for the treasurer link again.</div>';return}
  if(msg&&/turned off|not valid|cancelled|closed/i.test(msg)){app.innerHTML=head+`<div class="warn">${esc(msg)}</div>`;return}
  if(!S.name&&S.info&&S.info.name){S.name=S.info.name;save()}
  if(!S.name&&!S.info&&navigator.onLine&&!msg){app.innerHTML=head+'<div class="card note">Loading…</div>';return}
  if(!S.name){app.innerHTML=head+`<div class="card"><p>Enter your name once. It is shown next to every entry you record.</p><form id="nf"><label for="nm">Your name</label><input id="nm" required autocomplete="name"><button class="btn">Start</button></form></div>`;
    $('#nf').onsubmit=e=>{e.preventDefault();S.name=$('#nm').value.trim();save();render();sync()};return}
  const list=[...S.entries].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.t-b.t);let bal=0;
  const inn=list.filter(e=>e.dir==='in').reduce((a,e)=>a+e.amount,0),out=list.filter(e=>e.dir==='out').reduce((a,e)=>a+e.amount,0),q=list.filter(e=>!e.sent).length;
  app.innerHTML=head+`<div class="card"><form id="ef">
    <div class="seg"><button type="button" data-d="out" aria-pressed="${dir==='out'}">Money out</button><button type="button" data-d="in" aria-pressed="${dir==='in'}">Money in</button></div>
    <label for="dt">Date</label><input id="dt" type="date" value="${today()}" required>
    <label for="ct">Category</label><select id="ct">${(dir==='in'?IN:OUT).map(c=>`<option>${c}</option>`).join('')}</select>
    <label for="ds">Description</label><input id="ds" required placeholder="${dir==='in'?'e.g. Love gift from Grace Church':'e.g. Lunch for Team 1, van petrol'}">
    <label for="am">Amount (RM)</label><input id="am" type="number" inputmode="decimal" step="0.01" min="0.01" required>
    ${dir==='out'?`<label for="pb">Paid from</label><select id="pb"><option value="Team treasurer">Team cash (treasurer)</option><option value="Personal (claim)">Paid personally, to claim back</option></select>`:''}
    <button class="btn">Save entry</button></form>
    ${msg?`<p class="tiny" style="color:var(--red)">${esc(msg)}</p>`:''}</div>
   <div class="card"><div class="sum"><div><span>In</span><b>${rm(inn)}</b></div><div><span>Out</span><b>${rm(out)}</b></div><div><span>Balance</span><b>${rm(inn-out)}</b></div></div>
    <p class="tiny">${q?`${q} entr${q>1?'ies':'y'} waiting to send. They send automatically when you are back online.`:'All entries sent to the church records.'}</p>
    <table><thead><tr><th>Date</th><th>Description</th><th class="num">In</th><th class="num">Out</th><th class="num">Balance</th></tr></thead><tbody>
    ${list.map(e=>{bal+=(e.dir==='in'?1:-1)*e.amount;return `<tr><td>${e.date.slice(5)}</td><td>${esc(e.desc)}<br><span class="note">${esc(e.cat)}${e.paidBy==='Personal (claim)'?' · personal claim':''}</span> <span class="${e.sent?'s':'q'}">${e.sent?'Sent':'Waiting'}</span></td><td class="num">${e.dir==='in'?rm(e.amount):''}</td><td class="num">${e.dir==='out'?rm(e.amount):''}</td><td class="num">${rm(bal)}</td></tr>`}).reverse().join('')||'<tr><td colspan="5" class="note">No entries yet.</td></tr>'}
    </tbody></table><p class="tiny">Recording as ${esc(S.name)}. Keep every receipt. Pay from team cash so no one needs to claim later.</p><p class="tiny"><b>Tip:</b> add this page to your home screen (Share or ⋮ menu → Add to Home Screen) so it opens even with no signal.</p></div>`;
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dir=b.dataset.d;render()});
  $('#ef').onsubmit=e=>{e.preventDefault();const a=+$('#am').value;if(!(a>0))return;
    S.entries.push({id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now(),date:$('#dt').value,dir,cat:$('#ct').value,desc:$('#ds').value.trim(),amount:Math.round(a*100)/100,paidBy:dir==='out'?$('#pb').value:'',sent:false});
    save();render();sync()};
}
addEventListener('online',()=>{render();sync()});addEventListener('offline',render);
setInterval(sync,30000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();sync();
</script>
</body>
</html>
